name: PostgreSQL session-store integration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carscope_ci
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: carscope_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carscope_ci -d carscope_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tools/inspection-sync-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Install PostgreSQL driver for the integration test
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify PostgreSQL SessionStore against actual PostgreSQL 16
        run: node --test test/postgres-store.test.mjs && node --test test/avd-simulator.test.mjs && node --test test/avd-simulator-admin.test.mjs && node --test test/history-postgres.test.mjs
        env:
          PG_TEST_URL: postgresql://carscope_ci:local_test_only@127.0.0.1:5432/carscope_ci
