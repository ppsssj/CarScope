name: PostgreSQL session-store integration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carscope_ci
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: carscope_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carscope_ci -d carscope_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tools/inspection-sync-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Install PostgreSQL driver for the integration test
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify PostgreSQL SessionStore against actual PostgreSQL 16
        run: node --test test/postgres-store.test.mjs && node --test test/avd-simulator.test.mjs && node --test test/avd-simulator-admin.test.mjs && node --test test/history-postgres.test.mjs && node --test test/history-auth-postgres.test.mjs && node --test test/avd-history-postgres.test.mjs && node --test test/avd-history-activation-postgres.test.mjs && node --test test/part-detection-postgres.test.mjs && node --test test/deployment-postgres.test.mjs && node bin/deployment-preflight.mjs database --url-env PG_TEST_URL
        env:
          PG_TEST_URL: postgresql://carscope_ci:local_test_only@127.0.0.1:5432/carscope_ci
      # Disposable stand-in for the remote branch: TLS with a self-signed certificate under a non-loopback name.
      # Synthetic rows only. It reaches no Render service and is not evidence about one.
      - name: Start a disposable TLS PostgreSQL 16 under a non-loopback name
        run: |
          echo '127.0.0.1 carscope-remote-sim.internal' | sudo tee -a /etc/hosts
          docker run -d --name carscope-remote-sim -p 127.0.0.1:55433:5432 \
            -e POSTGRES_USER=carscope_ci -e POSTGRES_PASSWORD=local_test_only -e POSTGRES_DB=carscope_ci \
            postgres:16 -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          for i in $(seq 1 30); do docker exec carscope-remote-sim pg_isready -h 127.0.0.1 -U carscope_ci -d carscope_ci && exit 0; sleep 2; done
          exit 1
      - name: Backup and restore rehearsal with real pg_dump and pg_restore
        run: |
          node bin/db-recovery.mjs environment --url-env PG_TEST_URL --pg-bin "$PG_CLIENT_BIN"
          node --test --test-concurrency=1 test/db-recovery.test.mjs test/db-recovery-postgres.test.mjs
        env:
          PG_TEST_URL: postgresql://carscope_ci:local_test_only@127.0.0.1:5432/carscope_ci
          PG_REMOTE_SIM_URL: postgresql://carscope_ci:local_test_only@carscope-remote-sim.internal:55433/carscope_ci
          PG_CLIENT_BIN: /usr/lib/postgresql/16/bin
          PG_RECOVERY_REQUIRED: '1'
