name: Vision PoC CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/vision-poc/**'
      - 'tools/mobile-ar-poc/public/detector.mjs'
      - '.github/workflows/vision-poc-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/vision-poc/**'
      - 'tools/mobile-ar-poc/public/detector.mjs'
      - '.github/workflows/vision-poc-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vision-poc:
    # No model and no dataset here: this proves page behaviour and metric arithmetic, not detection of any part.
    name: Dataset gate, metrics and photo page (scripted detector, no model)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/vision-poc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: tools/mobile-ar-poc
      - run: python -m pip install pillow==12.0.0
      - run: npm run check
      - run: npm test
      - name: Real Chrome with a scripted detector (no trained model, no phone)
        run: npm run test:browser
