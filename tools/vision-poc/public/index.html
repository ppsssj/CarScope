<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>워셔액 주입구 탐지 PoC</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/poc.css">
  <script type="module" src="/poc.mjs"></script>
</head>
<body>
  <main>
    <p class="eyebrow">P12-B 연구용 · 검증되지 않음</p>
    <h1>워셔액 주입구 후보 찾기</h1>
    <p id="notice" class="notice">후보는 직접 확인할 위치일 뿐, 점검 결과가 아닙니다. 부품을 만지거나 캡·덮개를 열지 마세요. 직접 보충하지 마세요.</p>

    <label class="pick" for="photo">사진 고르기</label>
    <input id="photo" type="file" accept="image/*">
    <p class="note">사진은 이 브라우저 안에서만 처리하며 전송하거나 저장하지 않습니다.</p>

    <section aria-labelledby="ai-title">
      <h2 id="ai-title">AI 탐지</h2>
      <p id="ai-status" role="status" data-status="LOADING">모델을 확인하고 있어요.</p>
      <ol id="ai-candidates" class="candidates"></ol>
      <p id="ai-time" class="note"></p>
    </section>

    <figure id="figure" hidden>
      <canvas id="stage"></canvas>
      <figcaption>실선은 AI 후보, 점선은 색상 규칙 후보입니다.</figcaption>
    </figure>

    <section aria-labelledby="baseline-title">
      <h2 id="baseline-title">비교 기준 · 색상 규칙</h2>
      <p class="note">기존 파란색 영역 규칙입니다. AI가 아니고 부품을 알아보지 못하며, 신뢰도도 없습니다.</p>
      <p id="baseline-status" role="status" data-count="0">사진을 고르면 실행합니다.</p>
    </section>
  </main>
</body>
</html>
