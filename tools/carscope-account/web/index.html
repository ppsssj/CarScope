<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CarScope 계정</title>
<link rel="stylesheet" href="/account/account.css">
<script src="/account/vendor/supabase.js" defer></script>
<script type="module" src="/account/login-page.mjs"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/account/">CarScope</a><span class="spacer"></span><a class="quiet" id="trialTop" hidden>3D 점검으로</a></header>
<main>
  <section class="card" aria-labelledby="title">
    <div class="eyebrow">CarScope 계정</div>
    <h1 id="title">내 차량을 관리하려면 로그인하세요</h1>
    <p>로그인하면 내 차량을 등록하고 수정할 수 있습니다.</p>
    <p>3D 차량 탐색, 부품 선택, 스마트폰 QR 점검은 로그인 없이 그대로 쓸 수 있습니다.</p>
    <div class="actions">
      <button class="primary google" id="google" type="button" disabled>
        <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.9 10.7a5.4 5.4 0 0 1 0-3.4V5H.9a9 9 0 0 0 0 8l3-2.3z"/><path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"/></svg>
        <span>Google로 계속하기</span>
      </button>
      <a class="secondary" id="trial" hidden>로그인 없이 체험하기</a>
      <a class="secondary" id="toVehicles" href="/account/vehicles.html" hidden>내 차량으로 가기</a>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <details class="privacy" id="privacy"><summary>개인정보 처리 안내</summary><ul id="privacyList"></ul></details>
  </section>
</main>
</body>
</html>
