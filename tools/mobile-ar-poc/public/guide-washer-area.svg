<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="위에서 본 차의 보닛 영역">
  <!-- Original CarScope schematic of no particular vehicle. It marks the whole bonnet on purpose, never a point within it. -->
  <rect width="400" height="300" fill="#1e2228"/>
  <path d="M200 44 l-9 14 h18 z" fill="#a6adb7"/>
  <text x="200" y="36" fill="#a6adb7" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">앞</text>
  <g transform="rotate(0 200 170)">
    <rect x="132" y="64" width="136" height="222" rx="38" fill="#2a2f37" stroke="#5f6772" stroke-width="3"/>
    <path d="M140 134 V96 Q140 72 170 70 H230 Q260 72 260 96 V134 Q200 118 140 134 Z" fill="#14303a" stroke="#3ec6e0" stroke-width="4"/>
    <path d="M146 142 Q200 126 254 142 L244 176 Q200 164 156 176 Z" fill="#171a1f" stroke="#5f6772" stroke-width="2"/>
    <rect x="156" y="182" width="88" height="66" rx="10" fill="#1e2228" stroke="#5f6772" stroke-width="2"/>
    <rect x="124" y="136" width="10" height="14" rx="3" fill="#5f6772"/>
    <rect x="266" y="136" width="10" height="14" rx="3" fill="#5f6772"/>
  </g>
  <path d="M272 100 H316" stroke="#3ec6e0" stroke-width="2"/>
  <text x="320" y="96" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="16" font-weight="700">보닛</text>
  <text x="320" y="116" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="16" font-weight="700">안쪽</text>
  <text x="20" y="280" fill="#a6adb7" font-family="system-ui,sans-serif" font-size="13">설명용 그림</text>
</svg>
