<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarScope 3D geometry PoC</title>
<style>
  html,body{margin:0;height:100%;background:#f4f5f7;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#233448}
  #view{position:fixed;inset:0}
  #panel{position:fixed;top:8px;left:8px;background:#ffffffe6;border:1px solid #c9d0d8;border-radius:6px;padding:8px 10px;max-width:300px}
  #panel h1{font-size:13px;margin:0 0 6px}
  #panel label{display:block;margin:3px 0}
  #panel button{margin:2px 2px 2px 0}
  #info{position:fixed;right:8px;top:8px;background:#ffffffe6;border:1px solid #c9d0d8;border-radius:6px;padding:8px 10px;min-width:200px;white-space:pre}
  #stats{position:fixed;right:8px;bottom:8px;background:#ffffffe6;border:1px solid #c9d0d8;border-radius:6px;padding:6px 8px;white-space:pre;font-family:ui-monospace,Consolas,monospace;font-size:11px}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>CarScope 3D geometry lab (debug)</h1>
  <label>FRONT_LEFT <input id="fl" type="range" min="0" max="1" step="0.01" value="0"> <button data-anim="door-front-left">open/close</button></label>
  <label>REAR_LEFT <input id="rl" type="range" min="0" max="1" step="0.01" value="0"> <button data-anim="door-rear-left">open/close</button></label>
  <label><input id="wire" type="checkbox"> wireframe</label>
  <label><input id="normals" type="checkbox"> surface normals</label>
  <button id="svgcam">SVG camera</button><button id="freecam">free camera</button>
  <div><button data-view="front">FRONT</button><button data-view="rear">REAR</button><button data-view="left">LEFT</button><button data-view="right">RIGHT</button></div>
  <div style="margin-top:4px;color:#57606a">drag: rotate · wheel: zoom · click: select part</div>
</div>
<div id="info">no part selected</div>
<div id="stats"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
