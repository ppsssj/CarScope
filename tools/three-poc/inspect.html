<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarScope · 차량 점검</title>
<style>
  :root{
    --bg:#0e1013;--surface:#171a1f;--surface-2:#1e2228;--line:#2a2f37;--text:#e8eaed;--muted:#9aa1ab;--faint:#6b727c;
    --accent:#3ec6e0;--accent-ink:#06222a;--warn:#e0b25a;--panel-w:380px;--radius:14px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
  #view{position:fixed;inset:0}
  #view canvas{display:block;outline:none}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .topbar{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:16px 22px;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .brand{font-weight:700;letter-spacing:.02em}
  .vehicle{color:var(--muted);font-size:13px}
  .crumb{margin-left:auto;font-size:13px;color:var(--muted)}
  #back{display:none;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 11px;font-size:14px}
  body:not([data-state="IDLE"]) #back{display:inline-flex}

  #home{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .25s}
  body:not([data-state="IDLE"]) #home{opacity:0;pointer-events:none}
  #start{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 34px;font-size:17px;font-weight:700;min-width:220px}
  #start:disabled{background:var(--surface-2);color:var(--faint);cursor:default}
  .hint{color:var(--muted);font-size:13px}

  #panel{position:fixed;z-index:4;top:72px;right:18px;bottom:46px;width:var(--panel-w);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;overflow-y:auto;transform:translateX(calc(100% + 30px));transition:transform .3s ease}
  body:not([data-state="IDLE"]) #panel{transform:none}
  #panel h2{margin:0 0 4px;font-size:20px}
  #panel h3{margin:20px 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  #panel p{margin:6px 0;color:var(--muted)}
  #panel ol,#panel ul{margin:0;padding-left:20px}
  #panel li{margin:5px 0}
  .eyebrow{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
  .items{list-style:none;padding:0!important;margin:12px 0 0!important;display:flex;flex-direction:column;gap:8px}
  /* P10: one neutral border for every list row. Cyan means "selected" only; availability is the tag text, not a color. */
  .item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .item.available:hover{background:#252a31}
  .item[aria-disabled="true"]{cursor:default;color:var(--faint)}
  .tag{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  /* P11: a part with an AI method on the phone. Neutral like every tag: availability is decided on the phone, not here. */
  .ai-tag{margin-left:auto;margin-right:8px}
  .item[aria-pressed="true"]{background:#16303a;border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  button{min-height:44px}
  .accuracy{margin-top:10px!important;color:var(--warn);font-size:13px}
  #panel .accuracy li{margin:2px 0}
  .badge{display:inline-block;font-size:12px;color:var(--warn);border:1px solid #5a4a26;border-radius:6px;padding:1px 7px;margin:6px 0 2px}
  .badge.detached{color:var(--muted);border-color:var(--line)}
  .tire-status{display:grid;grid-template-columns:minmax(84px,.7fr) minmax(0,1.3fr);gap:10px 12px;margin:16px 0;font-size:13px}
  .tire-status dt{color:var(--muted)}
  .tire-status dd{margin:0;overflow-wrap:anywhere}
  .tire-state{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;max-width:100%;overflow-wrap:anywhere}
  .actions,.session-actions{display:flex;flex-direction:column;gap:8px;margin-top:22px}
  .session-actions{border-top:1px solid var(--line);padding-top:14px}
  .primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font-weight:700}
  .secondary{background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px}
  .progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:16px 0}
  .progress>i{display:block;height:100%;background:var(--accent);width:0}
  .qr{background:#fff;border-radius:10px;padding:10px;width:200px;height:200px;margin:12px 0}
  .qr img{width:100%;height:100%;display:block}
  .link{display:inline-block;min-height:44px;padding-block:10px;color:var(--accent);word-break:break-all}
  .tire-check{border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:8px 12px}
  .tire-check legend{font-size:14px;font-weight:600;padding:0 4px}
  .tire-check label{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
  .tire-check input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
  button:disabled{opacity:.5;cursor:default}
  .guide-confirm{width:100%}
  .sdk-details{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
  .sdk-details summary{min-height:44px;cursor:pointer;padding:10px 0}
  .tire-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .tire-map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:16px 0}
  .vehicle-front{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px}
  .tire-summary{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;overflow-wrap:anywhere}
  .tire-summary strong{font-size:14px}.tire-summary small{color:var(--muted);font-size:12px}
  .inspection-state{display:inline-flex;align-items:center;gap:4px;border:1px solid currentColor;border-radius:6px;padding:3px 7px;font-size:12px;color:#b1bdca;max-width:100%;overflow-wrap:anywhere}
  [data-inspection-state="FINDINGS_REPORTED"]{color:#ef9867}
  [data-inspection-state="UNABLE"]{color:#d9bd72}
  [data-inspection-state="NO_FINDINGS_REPORTED"]{color:#82b7dd}
  .item:has(.inspection-state){flex-wrap:wrap;gap:8px}
  .note{font-size:12px;color:var(--faint)!important}

  /* P10 PR #2: one layout for every screen. Same card, row, progress and notice styles; existing tokens only.
     Cyan is still the selection role; result colors stay on the state badges. */
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #panel h2:focus{outline:none}
  #panel button{max-width:100%;white-space:normal;overflow-wrap:anywhere}
  .progress-summary{margin:14px 0 4px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
  #panel .progress-head{margin:0;color:var(--text)}
  .progress-head strong{font-size:22px}.progress-head small{font-size:14px;color:var(--muted);font-weight:400}
  .progress-summary .progress{margin:10px 0}
  .result-counts{list-style:none;padding:0!important;margin:0!important;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px}
  #panel .result-counts li{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0;font-size:12px}
  .result-counts b{font-variant-numeric:tabular-nums}
  .item .row-name{flex:1 1 auto;min-width:0}
  .row-go{color:var(--faint);font-size:18px;line-height:1;margin-left:4px}
  .area-card,.result-row{flex-wrap:wrap;gap:6px 10px}
  .area-card small,.result-row small{order:3;width:100%;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
  .area-card:disabled{opacity:1;color:var(--faint)}
  #panel h3.result-group{display:flex;justify-content:space-between;margin-top:16px}
  .result-group small{color:var(--faint);font-weight:400}
  #panel .safety-note{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--warn);color:var(--text);font-size:13px}
  #panel .model-note{font-size:13px;margin:12px 0 6px}
  .model-note .badge{margin:0 6px 0 0}
  .result-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
  .result-meta{color:var(--muted);font-size:13px}
  #panel .part-results h3,#panel .mobile-flow h3{margin-top:0}
  .secondary.wide{width:100%;margin-top:10px}
  .dev-info{margin-top:12px;border-top:1px solid var(--line)}
  .dev-info>summary{min-height:44px;display:list-item;list-style-position:inside;padding:12px 0;cursor:pointer;color:var(--muted);font-size:13px}
  #exitConfirm{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#000b}
  #exitConfirm[hidden]{display:none}
  .dialog{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .dialog h2{margin:0 0 8px;font-size:20px}.dialog p{color:var(--muted);margin:6px 0}.dialog ul{margin:6px 0;padding-left:20px}
  .dialog-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.dialog-actions button{flex:1 1 140px}

  /* P10 PartLabel: one label rule for every modeled part (part-labels.mjs). The layer itself never takes input. */
  #partLabels,#partLabelLines{position:fixed;inset:0;z-index:2;pointer-events:none}
  #partLabelLines line{stroke:#c6d0db;stroke-width:1.5;opacity:.75}
  #partLabelLines circle{fill:#c6d0db}
  #partLabelLines [data-selected="true"]{stroke:var(--accent);fill:var(--accent);opacity:1}
  #partLabelLines [data-occluded="true"]{stroke-dasharray:3 3}
  .part-label{position:fixed;left:0;top:0;display:none;pointer-events:auto}
  .part-label[data-shown="true"]{display:block}
  .part-label button{display:inline-flex;align-items:center;gap:6px;min-width:44px;min-height:44px;padding:6px 12px;border-radius:999px;border:1px solid #4a525d;background:#171a1fe8;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px #0009}
  .part-label button:hover{background:#252a31}
  .part-label[data-selected="true"] button{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);cursor:default}
  .part-label[data-occluded="true"] button{border-style:dashed}
  .part-label[data-actionable="false"] button{cursor:default}
  .part-label .label-state{font-weight:700}
  .part-label[data-selected="true"] .label-state{color:inherit}
  .part-label .label-note{font-weight:400;font-size:12px}

  #toast{position:fixed;left:var(--free-center,50%);top:72px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--text);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
  .disclaimer{position:fixed;left:22px;bottom:14px;right:22px;font-size:11px;color:var(--faint);pointer-events:none}
  #status{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}

  #dev{position:fixed;left:18px;top:72px;width:300px;background:#000c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:11px/1.5 ui-monospace,Consolas,monospace;color:#b9c0c8;white-space:pre-wrap}
  #dev a{color:var(--accent)}

  @media (max-width:900px) and (orientation:landscape){
    :root{--panel-w:min(360px,44vw)}
    #panel{top:62px;bottom:10px;right:10px;padding:16px}
    .actions,.session-actions{margin-top:16px}
    .crumb,.vehicle,.disclaimer{display:none}
    .topbar{padding:12px 16px}
    #home{bottom:18px}
  }
  @media (max-width:900px) and (orientation:portrait){
    #panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;max-height:46vh;transform:translateY(calc(100% + 30px))}
    body[data-state="TIRE_PREVIEW"] .actions,body[data-state="TIRE_SUMMARY"] .actions{position:static}
    .crumb,.vehicle{display:none}
    #home{bottom:40px}
    .disclaimer{display:none}
  }
  .result-list .item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;white-space:normal}
  .result-list small{display:block;width:100%;overflow-wrap:anywhere}
  .part-results{margin-top:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
  .record-picker{display:grid;gap:8px;margin:12px 0;border:1px solid #414751;border-radius:10px;padding:10px}
  .record-picker button{text-align:left;white-space:normal;overflow-wrap:anywhere;min-height:44px}
  .record-picker [aria-pressed="true"]{border:2px solid #82b7dd;background:#192c3e}
  .mobile-flow{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
  .mobile-flow p{margin:0}
  .mobile-actions{display:flex;flex-wrap:wrap;gap:8px}
  .mobile-actions>*{flex:1 1 160px}
  .mobile-qr-slot{width:min(300px,100%);aspect-ratio:1;margin:0 auto;background:#fff;border-radius:8px}
  .record-history,.debug-admin{margin-top:10px}
  .part-results pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
  .result-error{border-left:3px solid #d9bd72;padding-left:10px}
  .source-zone{margin-top:16px;border:1px solid var(--line);border-left:4px solid var(--zone,var(--line));border-radius:10px;padding:12px;overflow-wrap:anywhere}
  .source-zone[data-source-zone="SESSION"]{--zone:#7fd1b9}
  .source-zone[data-source-zone="HISTORY"]{--zone:#b79cf0}
  /* P14: one read-only card per part. Each source keeps its own block; a disagreement is a separate notice. */
  .vehicle-status-card{margin-top:16px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
  #panel .vehicle-status-card h3{margin:0 0 8px}
  .vehicle-status-source{border-top:1px solid var(--line);padding:8px 0 2px}
  .vehicle-status-source h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
  .vehicle-status-list{list-style:none;padding:0!important;margin:0!important}
  #panel .vehicle-status-list li{margin:4px 0;font-size:14px}
  .vehicle-status-list small{color:var(--faint);margin-left:4px;white-space:nowrap}
  .source-zone[data-source-zone="SDK"]{--zone:var(--warn)}
  .source-zone .part-results{margin-top:6px;padding:0;border:0;background:none}
  .source-zone.dev-info{padding-top:0}
  .zone-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--zone);margin-bottom:6px}
  .zone-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
  .source-zone .secondary{width:100%;margin-top:8px}
  .history-card{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .history-card:hover{background:#262233}
  .history-part{font-weight:600;flex:1 1 auto;min-width:0}
  .history-card small{display:block;width:100%;color:var(--muted);overflow-wrap:anywhere}
  .history-filters{margin-top:12px;border-top:1px solid var(--line)}
  .history-filters summary{min-height:44px;padding:12px 0;cursor:pointer}
  .history-filters form{display:grid;gap:10px}
  .history-filters label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
  .history-filters select,.history-filters input{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px;width:100%;min-width:0}
  .history-dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .history-message{margin-top:16px;border-left:3px solid #d9bd72;padding:2px 0 2px 10px;overflow-wrap:anywhere}
  .history-message .secondary{width:100%;margin-top:8px}
  .history-loading{margin-top:16px}
  .history-more{width:100%;margin-top:12px}
  .history-demo{margin:12px 0 0!important;border:1px dashed var(--warn);border-radius:8px;padding:8px 10px;color:var(--warn)!important;font-size:13px}
  .history-demo-chip{color:var(--warn)!important;font-weight:600}
  .history-original summary{min-height:44px;padding:12px 0;cursor:pointer;color:var(--muted)}
  .history-original pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
  #historyResults:focus{outline:none}
  @media (prefers-reduced-motion:reduce){#panel,#home,#toast{transition:none}}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body data-state="IDLE">
<div id="view" aria-label="3D 차량 모델. 드래그해 회전, 휠로 확대·축소"></div>
<div id="status">차량 모델을 불러오는 중…</div>
<header class="topbar">
  <button id="back" type="button" aria-label="뒤로">← 뒤로</button>
  <span class="brand">CarScope</span>
  <span class="vehicle">2022 IONIQ 5 참조 모델</span>
  <span class="crumb" id="crumb" aria-live="polite"></span>
</header>
<div id="home">
  <button id="start" type="button" disabled>차량 점검</button>
  <span class="hint">드래그해 회전 · 휠로 확대/축소</span>
  <span class="hint">현재 점검 응답은 홈 복귀·종료·새로고침 시 지워집니다.</span>
</div>
<aside id="panel" aria-live="polite"></aside>
<svg id="partLabelLines" aria-hidden="true"></svg>
<div id="partLabels" role="group" aria-label="3D 모델 부품 이름표"></div>
<div id="toast" role="status"></div>
<div id="exitConfirm" hidden><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="exitConfirmTitle"></div></div>
<p class="disclaimer">커뮤니티 3D 자산 기반 참조 모델입니다. 실제 OEM 형상·치수가 아니며 부품 위치와 개방 동작은 추정·시뮬레이션입니다.</p>
<div id="dev" hidden></div>
<script type="module" src="./inspect.js"></script>
</body>
</html>
